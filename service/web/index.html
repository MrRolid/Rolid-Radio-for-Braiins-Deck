async function api(path,command){const r=await fetch(path,{method:command?'POST':'GET',headers:{Authorization:'Bearer '+token,...(command?{'Content-Type':'application/json'}:{})},body:command?JSON.stringify(command):undefined,signal:AbortSignal.timeout(4000)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
async function command(v){if(busy)return;busy=true;try{const d=await api('/command',v);display(d);return d;}catch(e){notice(e.message.includes('Catalog changed')?t('conflict'):e.message);throw e;}finally{busy=false;}}
function display(d){status=d;$('musicPosition').textContent=d.mode==='music'?'MUSIC · '+Math.floor(d.music?.position||0)+' s · '+d.status:'';$('musicRepeat').checked=!!d.music?.repeat;$('musicShuffle').checked=!!d.music?.shuffle;$('name').textContent=d.name||'—';$('state').textContent=(stateLabels[lang]?.[d.status]||d.status)+(d.error?' · '+d.error:'');if(document.activeElement!==$('volume'))$('volume').value=d.volume;$('volumeLabel').value=d.volume+'%';$('sleepLeft').textContent=d.sleep_remaining!=null?t('sleep')+' '+Math.ceil(d.sleep_remaining/60)+' min':'';['left','right'].forEach((id,i)=>{const v=(d.meter?.rms?.[i]||0)/1000;$(id).style.width=Math.max(0,Math.min(100,(20*Math.log10(v||.00001)+48)/48*100))+'%';});const x=d.technical;$('technical').textContent=x?[x.input_audio||x.decoder,'OUTPUT: '+(x.output_rate||'—')+' Hz / stereo PCM','UPTIME: '+x.uptime_s+' s · DATA AGE: '+x.last_data_ms+' ms · RECONNECTS: '+x.reconnects,'PCM: '+(x.pcm_bytes??'—')+' B · NETWORK (madplay): '+(x.network_bytes??'—')+' B','FFMPEG: '+(x.decoded_us!=null?(x.decoded_us/1e6).toFixed(1)+' s':'—')+' · '+(x.speed||'—'),x.last_error||''].join('\n'):'—';}
function loadDraft(d){draft=structuredClone(d.catalog.stations);revision=d.catalog.revision;bank=d.catalog.bank||'en';$('bank').replaceChildren(...[...new Set(['en','cz','de','es','ja','custom',...(d.bank_names||[]),bank])].map(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;return o;}));$('bank').value=bank;dirty=false;rows();}
async function play(s){if(!s)return;try{await command({action:'mute',value:false});await command({action:'play',name:s.name,url:s.url});}catch{}}
function rows(){$('stations').replaceChildren();draft.forEach((s,i)=>{const row=document.createElement('div');row.className='station';for(const k of ['name','url']){const input=document.createElement('input');input.value=s[k];input.placeholder=t(k);input.setAttribute('aria-label',t(k)+' '+(i+1));input.maxLength=k==='name'?60:1024;input.oninput=()=>{s[k]=input.value;dirty=true;};row.append(input);}for(const [label,action,edit] of [['▶',()=>play(s),false],['↑',()=>{if(i)[draft[i-1],draft[i]]=[draft[i],draft[i-1]];},true],['↓',()=>{if(i+1<draft.length)[draft[i],draft[i+1]]=[draft[i+1],draft[i]];},true],['×',()=>draft.splice(i,1),true]]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',label+' '+s.name);b.onclick=()=>{action();if(edit){dirty=true;rows();}};row.append(b);}const logo=document.createElement('input');logo.type='file';logo.accept='image/png,image/jpeg,image/webp';logo.setAttribute('aria-label','Station logo');logo.onchange=async()=>{try{const f=logo.files[0];if(!f||f.size>2*1024*1024)throw Error('Logo: max 2 MiB');const im=await createImageBitmap(f),c=document.createElement('canvas');c.width=c.height=48;const ratio=Math.min(48/im.width,48/im.height);c.getContext('2d').drawImage(im,(48-im.width*ratio)/2,(48-im.height*ratio)/2,im.width*ratio,im.height*ratio);im.close();const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));const b=new Uint8Array(await blob.arrayBuffer());if(b.length>8192)throw Error('Logo too complex');s.logo=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');dirty=true;notice('Logo ready. Save the group.');}catch(e){notice(e.message);}};row.append(logo);const clear=document.createElement('button');clear.textContent='Text';clear.onclick=()=>{s.logo='';dirty=true;};row.append(clear);$('stations').append(row);});}
async function donation(){const d=await api('/donation');$('address').textContent=d.address;const c=$('qr'),ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,246,246);if(d.matrix){const scale=Math.floor(246/d.matrix.length);ctx.fillStyle='black';d.matrix.forEach((line,y)=>[...line].forEach((v,x)=>{if(v==='1')ctx.fillRect(x*scale,y*scale,scale,scale);}));}else c.hidden=true;}
async function connect(){try{const d=await api('/status');sessionStorage.setItem('radio-token',token);connected=true;$('login').hidden=true;$('controls').hidden=false;display(d);loadDraft(d);await donation();await loadMusic();await loadAccess();notice('');}catch(e){notice(e.message);}}
$('loginForm').onsubmit=e=>{e.preventDefault();token=$('key').value;connect();};$('logout').onclick=()=>{sessionStorage.removeItem('radio-token');token='';connected=false;$('controls').hidden=true;$('login').hidden=false;};$('reload').onclick=async()=>{if(dirty&&!confirm(t('dirty')))return;try{const d=await api('/status');display(d);loadDraft(d);notice('');}catch(e){notice(e.message);}};
$('bank').onchange=async()=>{const next=$('bank').value;if(dirty&&!confirm(t('dirty'))){$('bank').value=bank;return;}try{const d=await command({action:'catalog',bank:next,revision:status.catalog.revision});if(d)loadDraft(d);}catch{}};
for(const id of ['bankNew','bankRename'])$(id).onclick=async()=>{const name=prompt('Group name',id==='bankRename'?bank:'');if(!name?.trim())return;try{const d=await command({action:'catalog',bank:name.trim(),rename_from:id==='bankRename'?bank:undefined,edit:true,revision,stations:draft});if(d)loadDraft(d);}catch{}};
$('add').onclick=()=>{if(draft.length>=32)return;draft.push({name:'',url:''});dirty=true;rows();};$('save').onclick=async()=>{try{const d=await command({action:'catalog',edit:true,bank,revision,stations:draft});if(d){loadDraft(d);notice(t('saved'));}}catch{}};
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));a.href=u;a.download='rolid-radio-stations.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f||f.size>65536)throw Error('Max 64 KiB');const v=JSON.parse(await f.text());if(!Array.isArray(v)||v.length<1||v.length>32||v.some(s=>typeof s.name!=='string'||typeof s.url!=='string'))throw Error('Invalid station list');draft=v.map(({name,url,logo})=>({name,url,logo:logo||""}));dirty=true;rows();}catch(e){notice(e.message);}$('import').value='';};
$('play').onclick=()=>status.mode==='music'?command({action:'music_resume'}).catch(()=>{}):play(status.url?{name:status.name,url:status.url}:status.catalog.stations[0]);$('stop').onclick=()=>command({action:'stop'}).catch(()=>{});$('mute').onclick=()=>command({action:'mute',value:!status.muted}).catch(()=>{});$('volume').onchange=()=>command({action:'volume',value:Number($('volume').value)}).catch(()=>{});$('sleep').onchange=()=>command({action:'sleep',minutes:Number($('sleep').value)}).catch(()=>{});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('address').textContent);notice(t('saved'));}catch{const r=document.createRange();r.selectNodeContents($('address'));getSelection().removeAllRanges();getSelection().addRange(r);}};

let folders=[],playlists=[],playlistDraft=[],playlistId="",musicTracks=[],uploading=false,cancelUpload=false;
const musicMessage=s=>$('musicNotice').textContent=s;
async function musicAction(v){const d=await api('/command',v);if(d.status)display(d);return d;}
async function loadMusic(){const d=await musicAction({action:'music_library'});if(d.error)throw Error(d.error);musicTracks=d.tracks;folders=d.folders||[];playlists=d.playlists||[];folderOptions($("musicFolder"),$("musicFolder").value||"*",true);const selected=$("playlistSelect").value;$("playlistSelect").replaceChildren(new Option("—",""),...playlists.map(p=>new Option(p.name,p.id)));$("playlistSelect").value=selected;$('musicCapacity').textContent=(d.used/1048576).toFixed(1)+' / '+(d.limit/1048576).toFixed(0)+' MiB · '+(d.free/1073741824).toFixed(2)+' GiB free';musicRows();}
function musicRows(){const list=$('musicTracks');list.replaceChildren();const q=$('musicSearch').value.toLocaleLowerCase(),sort=$('musicSort').value;musicTracks.filter(t=>($('musicFolder').value==='*'||t.folder===$('musicFolder').value)).filter(t=>[t.title,t.artist,t.album].join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>a[sort].localeCompare(b[sort])||a.title.localeCompare(b.title)).forEach(track=>{const row=document.createElement('div');row.style.cssText='border-top:1px solid var(--line);padding:12px 0';const fields=document.createElement('div');fields.className='toolbar';const inputs={};for(const k of ['title','artist','album']){const x=document.createElement('input');x.value=track[k];x.placeholder=t(k);x.maxLength=120;x.setAttribute('aria-label',t(k));inputs[k]=x;fields.append(x);}const destination=document.createElement('select');folderOptions(destination,track.folder||'',false);destination.setAttribute('aria-label',t('move'));fields.append(destination);row.append(fields);const buttons=document.createElement('div');buttons.className='toolbar';for(const [label,act] of [[t('playlistAdd'),async()=>{if(!playlistDraft.includes(track.id))playlistDraft.push(track.id);playlistRows();}],[t('move'),async()=>{await musicAction({action:'music_move',id:track.id,folder:destination.value});await loadMusic();}],['▶ '+t('play'),async()=>musicAction({action:'music_play',id:track.id,...($('musicFolder').value==='*'?{}:{folder:$('musicFolder').value})})],[t('musicSave'),async()=>{await musicAction({action:'music_edit',id:track.id,title:inputs.title.value,artist:inputs.artist.value,album:inputs.album.value});await loadMusic();}],[t('musicDelete'),async()=>{if(confirm(t('musicDelete')+' '+track.title+'?')){await musicAction({action:'music_delete',id:track.id});await loadMusic();}}]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>act().catch(e=>musicMessage(e.message));buttons.append(b);}const size=document.createElement('small');size.textContent=(track.bytes/1048576).toFixed(1)+' MiB';buttons.append(size);row.append(buttons);list.append(row);});}
$('musicSearch').oninput=musicRows;$('musicSort').onchange=musicRows;$('musicReload').onclick=()=>loadMusic().catch(e=>musicMessage(e.message));
$('musicUpload').onclick=async()=>{if(uploading)return;uploading=true;cancelUpload=false;$('musicUpload').disabled=true;$('musicCancel').hidden=false;$('musicProgress').hidden=false;let id=null;try{for(const file of $('musicFiles').files){if(cancelUpload)break;let d=await musicAction({action:'music_upload_begin',name:file.name,size:file.size,folder:$('musicFolder').value==='*'?'':$('musicFolder').value});id=d.upload.id;for(let offset=0;offset<file.size;offset+=24576){if(cancelUpload)throw Error(t('musicCancelled'));const bytes=new Uint8Array(await file.slice(offset,offset+24576).arrayBuffer());const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');await musicAction({action:'music_upload_chunk',id,offset,hex});$('musicProgress').value=Math.round((offset+bytes.length)/file.size*100);musicMessage(file.name+' · '+$('musicProgress').value+'%');}await musicAction({action:'music_upload_finish',id});id=null;await loadMusic();}musicMessage(cancelUpload?t('musicCancelled'):t('musicDone'));}catch(e){if(id)try{await musicAction({action:'music_upload_cancel',id});}catch{}musicMessage(e.message);}finally{uploading=false;$('musicUpload').disabled=false;$('musicCancel').hidden=true;$('musicFiles').value='';}};
$('musicCancel').onclick=()=>cancelUpload=true;
for(const [id,action] of [['musicPrev','music_previous'],['musicNext','music_next']])$(id).onclick=()=>musicAction({action}).catch(e=>musicMessage(e.message));
$('radioMode').onclick=()=>$('bank').scrollIntoView({behavior:'smooth'});
$('musicPause').onclick=()=>musicAction({action:status.mode!=='music'||status.status==='paused'||!status.wanted?'music_resume':'music_pause'}).catch(e=>musicMessage(e.message));
for(const id of ['musicRepeat','musicShuffle'])$(id).onchange=()=>musicAction({action:'music_options',repeat:$('musicRepeat').checked,shuffle:$('musicShuffle').checked}).catch(e=>musicMessage(e.message));


function folderPath(id){let out=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);const f=folders.find(f=>f.id===id);if(!f)break;out.unshift(f.name);id=f.parent;}return '/'+out.join('/');}
function folderOptions(el,value,all){el.replaceChildren(...(all?[new Option(t('allTracks'),'*')]:[]),new Option(t('root'),''),...folders.map(f=>new Option(folderPath(f.id),f.id)));el.value=value;if(el.selectedIndex<0)el.value=all?'*':'';}
$('musicFolder').onchange=musicRows;
async function groupAction(v){await musicAction(v);await loadMusic();}
$('folderNew').onclick=async()=>{const name=prompt(t('groupName'));if(!name)return;try{await groupAction({action:'music_folder_create',name,parent:$('musicFolder').value==='*'?'':$('musicFolder').value});}catch(e){musicMessage(e.message);}};
$('folderRename').onclick=async()=>{const id=$('musicFolder').value,f=folders.find(f=>f.id===id);if(!f)return;const name=prompt(t('groupName'),f.name);if(name)try{await groupAction({action:'music_folder_rename',id,name});}catch(e){musicMessage(e.message);}};
$('folderDelete').onclick=async()=>{const id=$('musicFolder').value;if(!folders.some(f=>f.id===id)||!confirm(t('musicDelete')+' '+folderPath(id)+'?'))return;try{await groupAction({action:'music_folder_delete',id});}catch(e){musicMessage(e.message);}};
function playlistRows(){const el=$('playlistTracks');el.replaceChildren();playlistDraft.forEach((id,i)=>{const row=document.createElement('div');row.className='toolbar';const label=document.createElement('span');label.textContent=(i+1)+'. '+(musicTracks.find(t=>t.id===id)?.title||'—');row.append(label);for(const [text,fn] of [['↑',()=>{if(i)[playlistDraft[i-1],playlistDraft[i]]=[playlistDraft[i],playlistDraft[i-1]];}],['↓',()=>{if(i+1<playlistDraft.length)[playlistDraft[i+1],playlistDraft[i]]=[playlistDraft[i],playlistDraft[i+1]];}],['×',()=>playlistDraft.splice(i,1)]]){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{fn();playlistRows();};row.append(b);}el.append(row);});}
$('playlistSelect').onchange=()=>{const p=playlists.find(p=>p.id===$('playlistSelect').value);playlistId=p?.id||'';playlistDraft=[...(p?.tracks||[])];$('playlistName').value=p?.name||'';playlistRows();};
$('playlistNew').onclick=()=>{$('playlistSelect').value='';$('playlistSelect').onchange();$('playlistName').focus();};
$('playlistSave').onclick=async()=>{try{await groupAction({action:'music_playlist_save',id:playlistId,name:$('playlistName').value,tracks:playlistDraft});if(!playlistId){playlistId=playlists.at(-1)?.id||'';$('playlistSelect').value=playlistId;}musicMessage(t('saved'));}catch(e){musicMessage(e.message);}};
$('playlistPlay').onclick=()=>{if(playlistId)musicAction({action:'music_play',playlist:playlistId}).catch(e=>musicMessage(e.message));};
$('playlistDelete').onclick=async()=>{if(playlistId&&confirm(t('musicDelete')+'?'))try{await groupAction({action:'music_playlist_delete',id:playlistId});$('playlistNew').click();}catch(e){musicMessage(e.message);}};
async function loadAccess(){const d=await api('/security');$('accessKey').value=d.access.key;$('accessEnabled').checked=d.access.enabled;}
$('accessSave').onclick=async()=>{const enabled=$('accessEnabled').checked&&$('accessKey').value.length>0;if(!enabled&&!confirm(t('disableConfirm')))return;try{const d=await api('/command',{action:'access_set',enabled,key:$('accessKey').value});token=d.access.key;sessionStorage.setItem('radio-token',token);await loadAccess();notice(t('saved'));}catch(e){notice(e.message);}};

$('networkAdd').onclick=()=>musicAction({action:'music_network_add',name:$('networkName').value,url:$('networkUrl').value,folder:$('musicFolder').value==='*'?'':$('musicFolder').value||''}).catch(e=>musicMessage(e.message));
async function meterPoll(){if(connected&&!document.hidden){try{const d=await api('/levels');['left','right'].forEach((id,i)=>{const v=(d.meter?.rms?.[i]||0)/1000;$(id).style.width=Math.max(0,Math.min(100,(20*Math.log10(v||.00001)+48)/48*100))+'%';});}catch{}}setTimeout(meterPoll,100);}meterPoll();
async function poll(){if(connected&&!busy&&!document.hidden){try{display(await api('/status'));}catch(e){notice(e.message);}}setTimeout(poll,1000);}connect();poll();
</script></html>

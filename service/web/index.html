<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoliD / Radio</title><style>
:root{color-scheme:dark;--bg:#101518;--panel:#20282c;--line:#3b474b;--ink:#e7e8de;--muted:#9aa8a9;--accent:#e9b960}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}h1{font-size:22px;letter-spacing:.12em;margin:0}h2{font-size:18px;letter-spacing:.08em}a{color:var(--accent)}header a{margin-left:auto}section{border:1px solid var(--line);background:var(--panel);padding:20px;margin-top:20px}button,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;min-height:48px;padding:10px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:var(--bg)}input{min-width:0;width:100%}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{width:auto}.muted,small{color:var(--muted)}.station{display:grid;grid-template-columns:2fr 4fr repeat(4,48px);gap:6px;margin:8px 0}.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.track{height:12px;background:var(--bg)}.bar{height:100%;background:var(--accent);width:0}#notice{min-height:24px;color:var(--accent);white-space:pre-wrap}#name{font-size:28px;margin:8px 0}#technical{white-space:pre-wrap;overflow-wrap:anywhere;font:14px monospace}.donation{display:flex;gap:28px;align-items:center;flex-wrap:wrap}#address{overflow-wrap:anywhere;max-width:440px}canvas{image-rendering:pixelated;background:white;max-width:100%}label{display:block;margin:10px 0}[hidden]{display:none!important}@media(max-width:650px){main{padding:12px}section{padding:12px}.station{grid-template-columns:repeat(4,1fr)}.station input{grid-column:1/-1}header a{margin-left:0}}
</style><main><header><h1>ROLID / RADIO <small>0.5.3</small></h1><select id="language" aria-label="Language"><option value="en">English</option><option value="cz">Čeština</option><option value="de">Deutsch</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="https://github.com/MrRolid/Rolid-Radio-for-Braiins-Deck" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><p><a id="panelLink" href="/">Remote web control panel</a></p><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2 data-t="connect"></h2><p data-t="keyHelp"></p><form id="loginForm"><label><span data-t="key"></span><input id="key" type="password" autocomplete="current-password" required></label><button class="primary" data-t="connect"></button></form></section><div id="controls" hidden><section><small id="state"></small><div id="name">—</div><div class="levels"><div class="track"><div id="left" class="bar"></div></div><div class="track"><div id="right" class="bar"></div></div></div><div class="toolbar"><button id="play" class="primary" data-t="play"></button><button id="rgbTest">RGB TEST</button><button id="stop" data-t="stop"></button><button id="mute" data-t="mute"></button><label><span data-t="volume"></span> <output id="volumeLabel"></output><input id="volume" type="range" min="0" max="100" step="5"></label><label><span data-t="sleep"></span> <select id="sleep"><option value="0">OFF</option><option>15</option><option>30</option><option>60</option><option>90</option><option>120</option></select> min</label></div><p id="sleepLeft" class="muted"></p></section><section><h2 data-t="stations"></h2><p class="muted" data-t="shared"></p><div class="toolbar"><label><span data-t="bank"></span> <select id="bank"><option value="en">EN</option><option value="cz">CZ</option><option value="de">DE</option><option value="es">ES</option><option value="ja">JP</option><option value="custom">USER</option></select></label><button id="reload" data-t="reload"></button><button id="export" data-t="export"></button><label><span data-t="import"></span><input id="import" type="file" accept="application/json,.json"></label></div><div id="stations"></div><div class="toolbar"><button id="add" data-t="add"></button><button id="save" class="primary" data-t="save"></button></div></section><section><h2 data-t="tech"></h2><div id="technical"></div><p class="muted" data-t="cache"></p></section><section class="donation"><canvas id="qr" width="246" height="246" aria-label="Bitcoin donation QR"></canvas><div><h2>BTC / SUPPORT</h2><p id="address"></p><button id="copy" data-t="copy"></button><p class="muted" data-t="fixed"></p></div></section><p><button id="logout" data-t="logout"></button></p></div></main><script>

const dictionaries={
en:{connect:'Connect to Deck',keyHelp:'Enter the access key printed by the installer. Use this panel on your local network.',key:'Access key',play:'Play',stop:'Stop',mute:'Mute / unmute',volume:'Volume',sleep:'Sleep',stations:'STATIONS / PRESETS',shared:'One shared list across scenes. The first 5 / 8 / 12 stations appear in small / medium / full. Language banks are editable starter lists.',bank:'Bank',reload:'Reload from device',export:'Export JSON',import:'Import JSON',add:'+ Station',save:'Save for all scenes',tech:'TECHNICAL DATA',cache:'Network cache occupancy is unavailable. PCM bytes are not downloaded network bytes. Meters measure PCM; they are not beat detection.',copy:'Copy address',fixed:'One address for this Deck, preserved across updates.',logout:'Disconnect',saved:'Saved.',dirty:'Discard unsaved changes?',conflict:'The list changed on another client. Reload it; export your edits first if needed.',name:'Station name',url:'Direct MP3 / AAC URL'},
cz:{connect:'Připojit k Decku',keyHelp:'Vlož přístupový klíč vypsaný instalátorem. Panel používej ve své místní síti.',key:'Přístupový klíč',play:'Přehrát',stop:'Zastavit',mute:'Ztlumit / obnovit',volume:'Hlasitost',sleep:'Vypnout za',stations:'STANICE / PRESETY',shared:'Společný seznam pro všechny scény. Prvních 5 / 8 / 12 stanic tvoří tlačítka small / medium / full. Jazykové banky jsou editovatelné výchozí seznamy.',bank:'Seznam',reload:'Načíst ze zařízení',export:'Export JSON',import:'Import JSON',add:'+ Stanice',save:'Uložit pro všechny scény',tech:'TECHNICKÉ ÚDAJE',cache:'Zaplnění síťové cache není dostupné. PCM byty nejsou stažená síťová data. Vybuzení je měřené PCM, nikoli detekce rytmu.',copy:'Kopírovat adresu',fixed:'Jedna adresa pro tento Deck, zachovaná při aktualizaci.',logout:'Odpojit',saved:'Uloženo.',dirty:'Zahodit neuložené změny?',conflict:'Seznam byl změněn jinde. Načti aktuální seznam; vlastní změny můžeš nejdříve exportovat.',name:'Název stanice',url:'Přímá MP3 / AAC URL'},
de:{connect:'Mit Deck verbinden',keyHelp:'Zugangsschlüssel aus der Installation eingeben. Im lokalen Netzwerk verwenden.',key:'Zugangsschlüssel',play:'Abspielen',stop:'Stopp',mute:'Stumm / Ton',volume:'Lautstärke',sleep:'Ausschalten in',stations:'SENDER / FAVORITEN',shared:'Gemeinsame Liste für alle Szenen. Erste 5 / 8 / 12 Sender für small / medium / full. Sprachlisten sind bearbeitbare Startlisten.',bank:'Liste',reload:'Vom Gerät laden',export:'JSON exportieren',import:'JSON importieren',add:'+ Sender',save:'Für alle Szenen speichern',tech:'TECHNISCHE DATEN',cache:'Netzwerkpuffer-Füllstand ist nicht verfügbar. PCM-Bytes sind keine Netzwerkdaten. PCM-Pegel ist keine Beat-Erkennung.',copy:'Adresse kopieren',fixed:'Eine feste Adresse pro Deck, bleibt bei Updates erhalten.',logout:'Trennen',saved:'Gespeichert.',dirty:'Ungespeicherte Änderungen verwerfen?',conflict:'Liste wurde anderswo geändert. Aktuelle Liste laden; Änderungen vorher exportieren.',name:'Sendername',url:'Direkte MP3 / AAC URL'},
es:{connect:'Conectar al Deck',keyHelp:'Introduce la clave del instalador. Usa el panel en tu red local.',key:'Clave de acceso',play:'Reproducir',stop:'Detener',mute:'Silenciar / activar',volume:'Volumen',sleep:'Apagar en',stations:'EMISORAS / FAVORITOS',shared:'Lista compartida entre escenas. Primeras 5 / 8 / 12 emisoras en small / medium / full. Las listas iniciales se pueden editar.',bank:'Lista',reload:'Cargar del dispositivo',export:'Exportar JSON',import:'Importar JSON',add:'+ Emisora',save:'Guardar para todas las escenas',tech:'DATOS TÉCNICOS',cache:'No se dispone del llenado de la caché. Los bytes PCM no son datos descargados. El nivel PCM no detecta el ritmo.',copy:'Copiar dirección',fixed:'Una dirección fija por Deck, conservada al actualizar.',logout:'Desconectar',saved:'Guardado.',dirty:'¿Descartar cambios sin guardar?',conflict:'La lista cambió en otro cliente. Recarga; puedes exportar tus cambios antes.',name:'Nombre',url:'URL directa MP3 / AAC'},
ja:{connect:'Deckに接続',keyHelp:'インストーラーのアクセスキーを入力してください。ローカルネットワークで使用します。',key:'アクセスキー',play:'再生',stop:'停止',mute:'ミュート切替',volume:'音量',sleep:'スリープ',stations:'放送局 / プリセット',shared:'全シーンで共有します。先頭の5 / 8 / 12局をsmall / medium / fullに表示します。初期リストは自由に編集できます。',bank:'リスト',reload:'端末から読み込み',export:'JSON書き出し',import:'JSON読み込み',add:'+ 放送局',save:'全シーンに保存',tech:'技術情報',cache:'ネットワークキャッシュ量は取得できません。PCMバイト数は通信量ではありません。レベル表示はPCM測定で、ビート検出ではありません。',copy:'アドレスをコピー',fixed:'端末ごとに固定され、更新後も保持されます。',logout:'切断',saved:'保存しました。',dirty:'未保存の変更を破棄しますか？',conflict:'別の画面で変更されました。編集内容を書き出してから再読み込みしてください。',name:'放送局名',url:'MP3 / AACの直接URL'}};
const $=id=>document.getElementById(id);let lang=localStorage.getItem('radio-language')||'en',token=sessionStorage.getItem('radio-token')||'',status={},draft=[],revision=0,bank='en',dirty=false,busy=false,connected=false;const t=k=>(dictionaries[lang]||dictionaries.en)[k]||k;
function language(){document.documentElement.lang=lang==='cz'?'cs':lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').value=lang;}$('language').onchange=()=>{lang=$('language').value;localStorage.setItem('radio-language',lang);language();};language();function notice(s){$('notice').textContent=s;}
$('panelLink').href=location.origin+'/';$('panelLink').textContent='Remote web control panel: '+location.origin; $('rgbTest').onclick=()=>command({action:'rgb_test'}).then(d=>{if(d)notice('RGB request #'+d.remote_revision+' sent. Keep the radio widget visible with RGB enabled.');}).catch(()=>{});
async function api(path,command){const r=await fetch(path,{method:command?'POST':'GET',headers:{Authorization:'Bearer '+token,...(command?{'Content-Type':'application/json'}:{})},body:command?JSON.stringify(command):undefined,signal:AbortSignal.timeout(4000)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
async function command(v){if(busy)return;busy=true;try{const d=await api('/command',v);display(d);return d;}catch(e){notice(e.message.includes('Catalog changed')?t('conflict'):e.message);throw e;}finally{busy=false;}}
function display(d){status=d;$('name').textContent=d.name||'—';$('state').textContent=(stateLabels[lang]?.[d.status]||d.status)+(d.error?' · '+d.error:'');if(document.activeElement!==$('volume'))$('volume').value=d.volume;$('volumeLabel').value=d.volume+'%';$('sleepLeft').textContent=d.sleep_remaining!=null?t('sleep')+' '+Math.ceil(d.sleep_remaining/60)+' min':'';['left','right'].forEach((id,i)=>{const v=(d.meter?.rms?.[i]||0)/1000;$(id).style.width=Math.max(0,Math.min(100,(20*Math.log10(v||.00001)+48)/48*100))+'%';});const x=d.technical;$('technical').textContent=x?[x.input_audio||x.decoder,'OUTPUT: '+(x.output_rate||'—')+' Hz / stereo PCM','UPTIME: '+x.uptime_s+' s · DATA AGE: '+x.last_data_ms+' ms · RECONNECTS: '+x.reconnects,'PCM: '+(x.pcm_bytes??'—')+' B · NETWORK (madplay): '+(x.network_bytes??'—')+' B','FFMPEG: '+(x.decoded_us!=null?(x.decoded_us/1e6).toFixed(1)+' s':'—')+' · '+(x.speed||'—'),x.last_error||''].join('\n'):'—';}
function loadDraft(d){draft=structuredClone(d.catalog.stations);revision=d.catalog.revision;bank=d.catalog.bank||'en';$('bank').value=bank;dirty=false;rows();}
async function play(s){if(!s)return;try{await command({action:'mute',value:false});await command({action:'play',name:s.name,url:s.url});}catch{}}
function rows(){$('stations').replaceChildren();draft.forEach((s,i)=>{const row=document.createElement('div');row.className='station';for(const k of ['name','url']){const input=document.createElement('input');input.value=s[k];input.placeholder=t(k);input.setAttribute('aria-label',t(k)+' '+(i+1));input.maxLength=k==='name'?60:1024;input.oninput=()=>{s[k]=input.value;dirty=true;};row.append(input);}for(const [label,action,edit] of [['▶',()=>play(s),false],['↑',()=>{if(i)[draft[i-1],draft[i]]=[draft[i],draft[i-1]];},true],['↓',()=>{if(i+1<draft.length)[draft[i],draft[i+1]]=[draft[i+1],draft[i]];},true],['×',()=>draft.splice(i,1),true]]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',label+' '+s.name);b.onclick=()=>{action();if(edit){dirty=true;rows();}};row.append(b);}$('stations').append(row);});}
async function donation(){const d=await api('/donation');$('address').textContent=d.address;const c=$('qr'),ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,246,246);if(d.matrix){const scale=Math.floor(246/d.matrix.length);ctx.fillStyle='black';d.matrix.forEach((line,y)=>[...line].forEach((v,x)=>{if(v==='1')ctx.fillRect(x*scale,y*scale,scale,scale);}));}else c.hidden=true;}
async function connect(){try{const d=await api('/status');sessionStorage.setItem('radio-token',token);connected=true;$('login').hidden=true;$('controls').hidden=false;display(d);loadDraft(d);await donation();notice('');}catch(e){notice(e.message);}}
$('loginForm').onsubmit=e=>{e.preventDefault();token=$('key').value.trim();connect();};$('logout').onclick=()=>{sessionStorage.removeItem('radio-token');token='';connected=false;$('controls').hidden=true;$('login').hidden=false;};$('reload').onclick=async()=>{if(dirty&&!confirm(t('dirty')))return;try{const d=await api('/status');display(d);loadDraft(d);notice('');}catch(e){notice(e.message);}};
$('bank').onchange=async()=>{const next=$('bank').value;if(dirty&&!confirm(t('dirty'))){$('bank').value=bank;return;}try{const d=await command({action:'catalog',bank:next,revision:status.catalog.revision});if(d)loadDraft(d);}catch{}};
$('add').onclick=()=>{if(draft.length>=32)return;draft.push({name:'',url:''});dirty=true;rows();};$('save').onclick=async()=>{try{const d=await command({action:'catalog',edit:true,bank,revision,stations:draft});if(d){loadDraft(d);notice(t('saved'));}}catch{}};
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));a.href=u;a.download='rolid-radio-stations.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f||f.size>65536)throw Error('Max 64 KiB');const v=JSON.parse(await f.text());if(!Array.isArray(v)||v.length<1||v.length>32||v.some(s=>typeof s.name!=='string'||typeof s.url!=='string'))throw Error('Invalid station list');draft=v.map(({name,url})=>({name,url}));dirty=true;rows();}catch(e){notice(e.message);}$('import').value='';};
$('play').onclick=()=>play(status.url?{name:status.name,url:status.url}:status.catalog.stations[0]);$('stop').onclick=()=>command({action:'stop'}).catch(()=>{});$('mute').onclick=()=>command({action:'mute',value:!status.muted}).catch(()=>{});$('volume').onchange=()=>command({action:'volume',value:Number($('volume').value)}).catch(()=>{});$('sleep').onchange=()=>command({action:'sleep',minutes:Number($('sleep').value)}).catch(()=>{});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('address').textContent);notice(t('saved'));}catch{const r=document.createRange();r.selectNodeContents($('address'));getSelection().removeAllRanges();getSelection().addRange(r);}};
async function poll(){if(connected&&!busy&&!document.hidden){try{display(await api('/status'));}catch(e){notice(e.message);}}setTimeout(poll,200);}if(token)connect();poll();
</script></html>
